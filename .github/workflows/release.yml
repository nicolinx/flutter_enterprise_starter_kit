name: Release

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor to build and distribute"
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  distribute_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate code (freezed / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Distribute via Fastlane
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: bundle exec fastlane android distribute_${{ inputs.flavor }}
