name: Release

# Two ways this runs:
# - push to main: always distributes the dev flavor automatically, no
#   human action needed, the standard "internal build is always current"
#   pattern.
# - workflow_dispatch: manual, lets you pick dev or prod. Production stays
#   manual on purpose (see docs/ARCHITECTURE.md), a deliberate human decision,
#   not a technical limitation.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor to build and distribute"
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  distribute_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate code (freezed / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      # Safety gate specific to this job: don't ship a build that fails
      # analyze/test, even if this ever runs on a push that somehow bypassed
      # ci.yml (e.g. branch protection not configured).
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Determine flavor
        id: flavor
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "flavor=dev" >> "$GITHUB_OUTPUT"
          else
            echo "flavor=${{ inputs.flavor }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Distribute via Fastlane
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: >
          bundle exec fastlane android distribute_${{ steps.flavor.outputs.flavor }}
          build_number:${{ github.run_number }}

      # Release notes only for prod: that's the only build that represents a
      # real, shippable version. Notes are published as a GitHub Release, not
      # committed back to the repo — pubspec.yaml's version stays a deliberate
      # human decision (see "Build numbers, bumped at build time, not
      # committed to git" in docs/ARCHITECTURE.md).
      - name: Read app version
        if: steps.flavor.outputs.flavor == 'prod'
        id: version
        run: |
          version=$(grep '^version:' pubspec.yaml | cut -d ' ' -f2 | cut -d '+' -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build changelog
        if: steps.flavor.outputs.flavor == 'prod'
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: .github/changelog-config.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        if: steps.flavor.outputs.flavor == 'prod'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
